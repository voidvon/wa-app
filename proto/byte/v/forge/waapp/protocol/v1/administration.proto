syntax = "proto3";

package byte.v.forge.waapp.protocol.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/pood1e/wa-app/gen/go/byte/v/forge/waapp/protocol/v1;protocolv1";

// Service-private authentication records. Never returned through account APIs.
message DashboardAdministrator {
  string username = 1;
  bytes password_hash = 2;
  google.protobuf.Timestamp created_at = 3;
}

message DashboardSession {
  string token_hash = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// Durable notification delivery state; transport configuration stays outside contracts.
message MessageNotification {
  string notification_id = 1;
  string wa_account_id = 2;
  string contact_ref = 3;
  string sender_ref = 4;
  string text = 5;
  google.protobuf.Timestamp received_at = 6;
}
